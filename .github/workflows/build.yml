name: Gerar APK do TCC2
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Configurar Flutter SDK Estavel
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet e pacotes numericos
        run: |
          python -m pip install --upgrade pip
          pip install flet numpy

      - name: Inicializar Pastas do Flutter App
        run: |
          flet build apk --yes || true

      - name: Aplicar Vacina de Dependencias (JNI Overrides)
        run: |
          if [ -d "build/apk" ]; then
            cp pubspec_overrides.yaml build/apk/ 2>/dev/null || true
            cd build/apk
            flutter pub get
          fi

      - name: Compilar o Aplicativo Final Destravado
        run: |
          flet build apk --yes --include assets

      - name: Disponibilizar arquivo APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Termodinamica_Movel_APK
          path: build/apk/
