name: Gerar APK do TCC2
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet Atualizado e Pacotes Numéricos
        run: |
          python -m pip install --upgrade pip
          pip install flet numpy

      - name: Compilar o Aplicativo (APK)
        run: |
          flet build apk --yes --include assets

      - name: Disponibilizar arquivo APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Termodinamica_Movel_APK
          path: build/apk/
